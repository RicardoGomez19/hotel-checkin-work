<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuario y contraseña · Configuración</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --paper:#FAF6EE; --paper-dim:#F1EBDB;
    --brass:#B8935A; --brass-deep:#8E6E3E; --line:#DCD3C0; --charcoal:#2A2620; --error:#B0463A; --ok:#5C6F4F;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); font-family:'Inter',sans-serif; color:var(--charcoal); min-height:100vh; padding:32px 16px; }
  .wrap{ max-width:520px; margin:0 auto; background:var(--paper); border:1px solid rgba(184,147,90,0.35); box-shadow:0 30px 60px -20px rgba(0,0,0,0.5); }
  nav{ display:flex; align-items:center; gap:10px; padding:16px 32px; border-bottom:1px solid var(--line); background:var(--paper-dim); }
  nav a{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:rgba(42,38,32,0.55); text-decoration:none; }
  header{ padding:24px 32px 8px; }
  h1{ font-family:'Fraunces',serif; font-size:19px; margin:0; color:var(--ink); }
  p.sub{ margin:6px 0 0; font-size:13px; color:rgba(42,38,32,0.6); }
  form{ padding:20px 32px 28px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--brass-deep); }
  input{ font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 12px; border:1px solid var(--line); background:#fff; color:var(--charcoal); outline:none; }
  input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,147,90,0.18); }
  .hint{ font-size:11.5px; color:rgba(42,38,32,0.5); margin-top:-2px; }
  hr{ border:none; border-top:1px dashed var(--line); margin:20px 0; }
  button{ padding:11px 20px; font-weight:600; font-size:13px; background:var(--ink); color:var(--paper); border:none; cursor:pointer; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .msg{ margin-top:14px; padding:10px 12px; font-size:12.5px; display:none; }
  .msg.error{ display:block; background:#FBECEA; border:1px solid var(--error); color:var(--error); }
  .msg.ok{ display:block; background:#EFF3EC; border:1px solid var(--ok); color:var(--ok); }
  @media (max-width: 560px){
    body{ padding:16px 10px; } .wrap{ max-width:100%; }
    nav{ padding:12px 18px; } header{ padding:18px 18px 6px; } form{ padding:16px 18px 22px; }
    button{ width:100%; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/settings.html">← Configuración</a></nav>
    <header>
      <h1>Usuario y contraseña</h1>
      <p class="sub">Por seguridad, necesitas confirmar la contraseña actual para guardar cambios.</p>
    </header>
    <form id="credForm">
      <div class="field">
        <label for="currentPassword">Contraseña actual</label>
        <input type="password" id="currentPassword" autocomplete="current-password" required>
      </div>
      <hr>
      <div class="field">
        <label for="newUsername">Nuevo usuario (opcional)</label>
        <input type="text" id="newUsername" autocomplete="username" placeholder="Déjalo vacío para no cambiarlo">
      </div>
      <div class="field">
        <label for="newPassword">Nueva contraseña (opcional)</label>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="Déjalo vacío para no cambiarla">
        <span class="hint">Mínimo 6 caracteres.</span>
      </div>
      <button type="submit" id="saveBtn">Guardar cambios</button>
      <div class="msg" id="msgBox"></div>
    </form>
  </div>
<script>
  const form = document.getElementById('credForm');
  const btn = document.getElementById('saveBtn');
  const msgBox = document.getElementById('msgBox');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    try {
      const res = await fetch('/api/settings/credentials', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: document.getElementById('currentPassword').value,
          newUsername: document.getElementById('newUsername').value,
          newPassword: document.getElementById('newPassword').value,
        }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo guardar.');
      msgBox.textContent = 'Listo. Por seguridad vas a tener que iniciar sesión de nuevo…';
      msgBox.className = 'msg ok';
      setTimeout(() => { window.location.href = '/login.html'; }, 1800);
    } catch(err){
      msgBox.textContent = err.message;
      msgBox.className = 'msg error';
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
    }
  });
</script>
</body>
</html>
