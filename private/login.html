<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · Panel del hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --paper:#FAF6EE; --paper-dim:#F1EBDB;
    --brass:#B8935A; --brass-deep:#8E6E3E; --line:#DCD3C0; --charcoal:#2A2620; --error:#B0463A;
  }
  *{box-sizing:border-box;}
  html{ background:var(--ink); }
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:var(--ink); font-family:'Inter',sans-serif; color:var(--charcoal); padding:16px;
  }
  .card{
    width:100%; max-width:360px; background:var(--paper);
    border:1px solid rgba(184,147,90,0.35); box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    padding:32px 28px;
  }
  h1{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 4px; color:var(--ink); }
  p.sub{ margin:0 0 22px; font-size:13px; color:rgba(42,38,32,0.6); }
  label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--brass-deep); }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  input{
    font-family:'Inter',sans-serif; font-size:15px; padding:11px 12px;
    border:1px solid var(--line); background:#fff; color:var(--charcoal); outline:none;
  }
  input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,147,90,0.18); }
  button{
    width:100%; margin-top:8px; padding:12px; font-weight:600; font-size:14px;
    background:var(--ink); color:var(--paper); border:none; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .error{
    display:none; margin-top:14px; padding:10px 12px; background:#FBECEA;
    border:1px solid var(--error); color:var(--error); font-size:12.5px;
  }
  .error.show{ display:block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Panel del hotel</h1>
    <p class="sub">Acceso solo para personal autorizado.</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn">Entrar</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('loginError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
      window.location.href = '/registros.html';
    } catch(err){
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
