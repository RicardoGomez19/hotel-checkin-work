<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administradores · Configuración</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --paper:#FAF6EE; --paper-dim:#F1EBDB;
    --brass:#B8935A; --brass-deep:#8E6E3E; --line:#DCD3C0; --charcoal:#2A2620; --error:#B0463A; --ok:#5C6F4F;
  }
  *{box-sizing:border-box;}
  html{ background:var(--ink); }
  body{ margin:0; background:var(--ink); font-family:'Inter',sans-serif; color:var(--charcoal); min-height:100vh; min-height:100dvh; padding:32px 16px; }
  .wrap{ max-width:560px; margin:0 auto; background:var(--paper); border:1px solid rgba(184,147,90,0.35); box-shadow:0 30px 60px -20px rgba(0,0,0,0.5); }
  nav{ padding:16px 32px; border-bottom:1px solid var(--line); background:var(--paper-dim); }
  nav a{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em; color:rgba(42,38,32,0.55); text-decoration:none; }
  header{ padding:24px 32px 4px; }
  h1{ font-family:'Fraunces',serif; font-size:19px; margin:0; color:var(--ink); }
  p.sub{ margin:6px 0 0; font-size:13px; color:rgba(42,38,32,0.6); }
  .body{ padding:20px 32px 28px; }

  .admin-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:12px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .admin-item:last-child{ border-bottom:none; }
  .admin-item .who{ display:flex; flex-direction:column; gap:2px; }
  .admin-item .username{ font-weight:600; }
  .admin-item .created{ font-size:11px; color:rgba(42,38,32,0.5); font-family:'IBM Plex Mono',monospace; }
  .tag-me{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--brass-deep); background:var(--paper-dim); padding:2px 7px; margin-left:8px; border:1px solid var(--line);
  }
  .admin-actions{ display:flex; gap:6px; flex-shrink:0; }
  .admin-actions button{
    padding:6px 11px; font-size:11.5px; font-weight:600; border:1px solid var(--line); background:#fff;
    color:var(--ink); cursor:pointer;
  }
  .admin-actions .del-admin{ color:var(--error); border-color:rgba(176,70,58,0.35); }
  .admin-actions button:disabled{ opacity:0.35; cursor:not-allowed; }
  .empty-hint{ font-size:12.5px; color:rgba(42,38,32,0.5); padding:8px 0; }

  hr{ border:none; border-top:1px dashed var(--line); margin:20px 0; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  label{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--brass-deep); }
  input{ font-family:'Inter',sans-serif; font-size:14.5px; padding:10px 12px; border:1px solid var(--line); background:#fff; color:var(--charcoal); outline:none; width:100%; }
  input:focus{ border-color:var(--brass); box-shadow:0 0 0 3px rgba(184,147,90,0.18); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .hint{ font-size:11.5px; color:rgba(42,38,32,0.5); margin-top:-2px; }
  button.primary{ padding:11px 20px; font-weight:600; font-size:13px; background:var(--ink); color:var(--paper); border:none; cursor:pointer; }
  button.primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .msg{ margin-top:14px; padding:10px 12px; font-size:12.5px; display:none; }
  .msg.error{ display:block; background:#FBECEA; border:1px solid var(--error); color:var(--error); }
  .msg.ok{ display:block; background:#EFF3EC; border:1px solid var(--ok); color:var(--ok); }

  /* ---- Modal para editar un administrador ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(27,36,48,0.6);
    align-items:center; justify-content:center; padding:16px; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--paper); border:1px solid rgba(184,147,90,0.4); max-width:400px; width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6); padding:24px;
    max-height:calc(100vh - 32px); overflow-y:auto; -webkit-overflow-scrolling:touch; box-sizing:border-box;
  }
  .modal-box h3{ font-family:'Fraunces',serif; margin:0 0 4px; font-size:17px; color:var(--ink); }
  .modal-box p.sub{ margin:0 0 16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .modal-actions button{ padding:9px 16px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .modal-actions .btn-confirm{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  @media (max-width: 560px){
    body{ padding:16px 10px; } .wrap{ max-width:100%; }
    nav{ padding:12px 18px; } header{ padding:18px 18px 4px; } .body{ padding:16px 18px 22px; }
    .row2{ grid-template-columns:1fr; } button.primary{ width:100%; }
    .admin-item{ flex-direction:column; align-items:flex-start; gap:8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <nav><a href="/settings.html">← Configuración</a></nav>
    <header>
      <h1>Administradores</h1>
      <p class="sub">Quiénes pueden entrar al panel de registros. Puedes agregar, editar o eliminar cuentas.</p>
    </header>
    <div class="body">
      <div id="adminsList"><p class="empty-hint">Cargando…</p></div>
      <hr>
      <div class="field">
        <label for="newUsername">Nuevo usuario</label>
        <input type="text" id="newUsername" autocomplete="off" placeholder="Ej. recepcion2">
      </div>
      <div class="field">
        <label for="newPassword">Contraseña</label>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
      </div>
      <button class="primary" id="addBtn">+ Agregar administrador</button>
      <div class="msg" id="addMsg"></div>
    </div>
  </div>

  <!-- Modal de edición -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3>Editar administrador</h3>
      <p class="sub" style="font-size:12.5px; color:rgba(42,38,32,0.6);">Deja la contraseña vacía si no quieres cambiarla.</p>
      <div class="field">
        <label for="editUsername">Usuario</label>
        <input type="text" id="editUsername" autocomplete="off">
      </div>
      <div class="field">
        <label for="editPassword">Nueva contraseña (opcional)</label>
        <input type="password" id="editPassword" autocomplete="new-password" placeholder="Déjalo vacío para no cambiarla">
        <span class="hint">Mínimo 6 caracteres.</span>
      </div>
      <div class="msg" id="editMsg"></div>
      <div class="modal-actions">
        <button id="editCancelBtn">Cancelar</button>
        <button id="editSaveBtn" class="btn-confirm">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación para eliminar -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <h3>¿Eliminar administrador?</h3>
      <p class="sub" id="confirmMsg" style="font-size:12.5px; color:rgba(42,38,32,0.6);"></p>
      <div class="modal-actions">
        <button id="confirmCancelBtn">Cancelar</button>
        <button id="confirmOkBtn" class="btn-confirm" style="background:var(--error); border-color:var(--error);">Eliminar</button>
      </div>
    </div>
  </div>

<script>
  let admins = [];
  let editandoId = null;
  let eliminandoId = null;

  function formatoFecha(iso){
    if(!iso) return '';
    const d = new Date(iso.replace(' ', 'T'));
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function cargarAdmins(){
    const res = await fetch('/api/admins');
    if(res.status === 401){ window.location.href = '/login.html'; return; }
    admins = await res.json();
    const cont = document.getElementById('adminsList');
    if(admins.length === 0){
      cont.innerHTML = '<p class="empty-hint">No hay administradores — esto no debería pasar.</p>';
      return;
    }
    cont.innerHTML = '';
    admins.forEach((a) => {
      const div = document.createElement('div');
      div.className = 'admin-item';
      const soloUno = admins.length <= 1;
      div.innerHTML = `
        <span class="who">
          <span class="username">${a.username}${a.isMe ? '<span class="tag-me">Tú</span>' : ''}</span>
          <span class="created">Creado ${formatoFecha(a.createdAt)}</span>
        </span>
        <span class="admin-actions">
          <button class="edit-admin" data-id="${a.id}">Editar</button>
          <button class="del-admin" data-id="${a.id}" data-username="${a.username}" ${a.isMe || soloUno ? 'disabled title="' + (a.isMe ? 'No puedes eliminar tu propia cuenta' : 'Debe quedar al menos un administrador') + '"' : ''}>Eliminar</button>
        </span>
      `;
      cont.appendChild(div);
    });
  }
  cargarAdmins();

  // ---- Agregar ----
  document.getElementById('addBtn').addEventListener('click', async () => {
    const msg = document.getElementById('addMsg');
    msg.className = 'msg';
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    try {
      const res = await fetch('/api/admins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo agregar.');
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      msg.textContent = 'Administrador agregado.';
      msg.className = 'msg ok';
      cargarAdmins();
    } catch(err){
      msg.textContent = err.message;
      msg.className = 'msg error';
    }
  });

  // ---- Editar ----
  document.getElementById('adminsList').addEventListener('click', (e) => {
    const editBtn = e.target.closest('.edit-admin');
    if(editBtn){
      editandoId = Number(editBtn.dataset.id);
      const admin = admins.find(a => a.id === editandoId);
      document.getElementById('editUsername').value = admin.username;
      document.getElementById('editPassword').value = '';
      document.getElementById('editMsg').className = 'msg';
      document.getElementById('editModal').classList.add('open');
      return;
    }
    const delBtn = e.target.closest('.del-admin');
    if(delBtn && !delBtn.disabled){
      eliminandoId = Number(delBtn.dataset.id);
      document.getElementById('confirmMsg').textContent = `Se eliminará la cuenta "${delBtn.dataset.username}". Esta acción no se puede deshacer.`;
      document.getElementById('confirmModal').classList.add('open');
    }
  });

  document.getElementById('editCancelBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('open');
    editandoId = null;
  });

  document.getElementById('editSaveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('editMsg');
    msg.className = 'msg';
    const username = document.getElementById('editUsername').value.trim();
    const password = document.getElementById('editPassword').value;
    try {
      const res = await fetch(`/api/admins/${editandoId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo guardar.');
      document.getElementById('editModal').classList.remove('open');
      if(data.loggedOutSelf){
        // Si te editaste a ti mismo, tu propia sesión ya se cerró en el
        // servidor — hay que volver a iniciar sesión con los datos nuevos.
        window.location.href = '/login.html';
        return;
      }
      cargarAdmins();
    } catch(err){
      msg.textContent = err.message;
      msg.className = 'msg error';
    }
  });

  // ---- Eliminar ----
  document.getElementById('confirmCancelBtn').addEventListener('click', () => {
    document.getElementById('confirmModal').classList.remove('open');
    eliminandoId = null;
  });

  document.getElementById('confirmOkBtn').addEventListener('click', async () => {
    try {
      const res = await fetch(`/api/admins/${eliminandoId}`, { method: 'DELETE' });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'No se pudo eliminar.');
      document.getElementById('confirmModal').classList.remove('open');
      cargarAdmins();
    } catch(err){
      alert(err.message);
      document.getElementById('confirmModal').classList.remove('open');
    }
  });
</script>
</body>
</html>
